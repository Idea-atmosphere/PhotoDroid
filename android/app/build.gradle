plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.storyteller.photocraft'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.storyteller.photocraft'
        // Storage Access Framework and MediaStore Downloads (no storage permissions) need 29.
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.3.0'
        // The Rust library is built for arm64 only (see README.md).
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
